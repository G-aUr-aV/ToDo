<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todo — UX mockup</title>
<style>
@font-face { font-family: Inter; src: url("../../../app/public/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --canvas: #faf9f7; --sidebar: #f3f1ed; --surface: #ffffff; --hover: #f2f0ec; --selected: #ebe8e3;
  --line: #e8e5e0; --line-strong: #d6d2cb;
  --ink: #1d1c1a; --ink-2: #4a4743; --muted: #8a857e; --faint: #b4afa8;
  --accent: #2e6b57; --accent-ink: #ffffff; --accent-soft: #e6efe9;
  --chip: #f0eee9; --chip-ink: #57534d; --key: #eef0f4; --key-ink: #3d4a63;
  --warn: #9a5b12; --shadow: 0 1px 2px rgba(29,28,26,.04), 0 8px 24px rgba(29,28,26,.06);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --canvas: #141413; --sidebar: #1a1a18; --surface: #1d1d1b; --hover: #222220; --selected: #292926;
  --line: #2a2926; --line-strong: #383632;
  --ink: #ecebe7; --ink-2: #c4c1bb; --muted: #8e8a83; --faint: #5f5c57;
  --accent: #7cc4a6; --accent-ink: #10231b; --accent-soft: #1f2e27;
  --chip: #262522; --chip-ink: #b9b5ae; --key: #232733; --key-ink: #aab8d6;
  --warn: #e0a85c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 Inter, system-ui, sans-serif; font-feature-settings: "cv11", "ss01"; background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.shell { display: grid; grid-template-columns: 232px 1fr; height: 100%; }
/* Sidebar */
.side { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.brand .mark { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand .mark svg { width: 13px; height: 13px; stroke-width: 2.4; }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin-bottom: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--muted); }
.search kbd { margin-left: auto; }
kbd { font: 500 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 4px; background: var(--surface); }
.nav { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 7px; color: var(--ink-2); width: 100%; text-align: left; }
.nav:hover { background: var(--hover); }
.nav[aria-current="page"] { background: var(--selected); color: var(--ink); font-weight: 550; }
.nav .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .dot { width: 8px; height: 8px; border-radius: 3px; margin: 0 4px; flex: none; }
.side h3 { display: flex; align-items: center; justify-content: space-between; margin: 18px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.side h3 button { color: var(--muted); border-radius: 5px; padding: 2px; } .side h3 button:hover { background: var(--hover); color: var(--ink); }
.side .spacer { flex: 1; }
.status { display: flex; align-items: center; gap: 8px; padding: 10px 10px 2px; margin-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* Main */
main { overflow: auto; }
.page { max-width: 780px; padding: 40px 48px 120px; }
.head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
.head h1 { margin: 0; font: 600 28px/1.15 var(--serif); letter-spacing: -.015em; }
.head .sub { color: var(--muted); font-size: 13px; }
.head .tools { margin-left: auto; display: flex; gap: 4px; }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--ink); }

/* Quick add */
.add { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 22px; transition: border-color .15s, box-shadow .15s; }
.add:focus-within { border-color: var(--line-strong); box-shadow: var(--shadow); }
.add svg { color: var(--muted); }
.add input { flex: 1; border: 0; outline: none; background: none; padding: 2px 0; }
.add input::placeholder { color: var(--faint); }
.add .chips { display: none; gap: 6px; } .add:focus-within .chips { display: flex; }

/* Groups and rows */
.group { margin-bottom: 18px; }
.group > h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.group > h2 .dot { width: 8px; height: 8px; border-radius: 3px; }
.group > h2 .n { font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
.row { position: relative; display: flex; align-items: flex-start; gap: 11px; padding: 8px 10px; border-radius: 8px; cursor: default; transition: background .12s, opacity .3s, transform .3s; }
.row:hover { background: var(--hover); }
.row.open { background: var(--surface); box-shadow: var(--shadow); border-radius: 10px 10px 0 0; }
.row.leaving { opacity: 0; transform: translateX(6px); }
.check { width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; flex: none; transition: border-color .15s, background .2s; }
.check:hover { border-color: var(--accent); }
.check svg { width: 11px; height: 11px; stroke-width: 3; stroke: var(--accent-ink); stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s .05s; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { stroke-dashoffset: 0; }
.title { flex: 1; min-width: 0; cursor: pointer; }
.title .t { overflow-wrap: anywhere; }
.done-row .title .t { color: var(--muted); }
.meta { display: inline-flex; gap: 8px; align-items: center; margin-left: 4px; font-size: 12px; color: var(--faint); vertical-align: -1px; }
.meta span { display: inline-flex; gap: 3px; align-items: center; }
.tedit { width: 100%; border: 0; outline: none; background: none; padding: 0; font-weight: 550; }
.meta svg { width: 13px; height: 13px; }
.meta .warn { color: var(--warn); }
.outcome { margin-top: 3px; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--chip-ink); font-size: 12px; line-height: 19px; vertical-align: 1px; text-decoration: none; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
a.chip:hover { color: var(--ink); background: var(--selected); }
.chip svg { width: 12px; height: 12px; }
.chip.key { background: var(--key); color: var(--key-ink); font: 500 11.5px/19px var(--mono); }
.row .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; margin: -4px -4px -4px 0; }
.row:hover .acts, .row.open .acts, .row:focus-within .acts { opacity: 1; }
.right { font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 1px; font-variant-numeric: tabular-nums; }

/* Detail */
.detail { background: var(--surface); box-shadow: var(--shadow); border-radius: 0 0 10px 10px; padding: 2px 16px 12px 39px; margin-bottom: 10px; animation: open .18s ease-out; }
@keyframes open { from { opacity: 0; transform: translateY(-4px); } }
.props { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 12px; }
.prop { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; }
.prop:hover { border-color: var(--line-strong); background: var(--hover); }
.prop .dot { width: 8px; height: 8px; border-radius: 3px; }
.prop.ghost { border-style: dashed; color: var(--muted); }
.notes { position: relative; border-top: 1px solid var(--line); padding: 12px 0 4px; min-height: 64px; cursor: text; color: var(--ink-2); }
.notes:hover::after { content: "Click to edit"; position: absolute; right: 0; top: 12px; font-size: 11.5px; color: var(--faint); }
.notes.editing::after { display: none; }
.notes .ph { color: var(--faint); }
.notes h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.notes h4:first-child { margin-top: 0; }
.notes p { margin: 0 0 6px; }
.notes ul { margin: 0 0 6px; padding-left: 18px; }
.notes li.cb { list-style: none; margin-left: -18px; display: flex; gap: 8px; align-items: flex-start; }
.notes li.cb .check { width: 15px; height: 15px; border-radius: 4px; margin-top: 2px; }
.notes li.cb .check svg { width: 9px; height: 9px; }
.notes li.cb.done span { color: var(--muted); text-decoration: line-through; }
.notes code { font: 12.5px var(--mono); background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.notes a { color: var(--accent); text-decoration: none; } .notes a:hover { text-decoration: underline; }
.notes textarea { width: 100%; min-height: 120px; resize: vertical; border: 0; outline: none; background: none; font: 13px/1.6 var(--mono); color: var(--ink); padding: 0; }
.dfoot { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; font-weight: 550; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { color: var(--ink-2); } .btn.quiet:hover { background: var(--hover); }
.btn kbd { background: transparent; border-color: color-mix(in srgb, currentColor 35%, transparent); color: inherit; opacity: .8; }
.saved { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.saved i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Popover */
.pop { position: absolute; z-index: 20; min-width: 200px; padding: 5px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pop button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 9px; border-radius: 6px; text-align: left; color: var(--ink-2); }
.pop button:hover, .pop button.hl { background: var(--hover); color: var(--ink); }
.pop button kbd { margin-left: auto; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.pop .danger { color: #b2443c; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; display: flex; align-items: center; gap: 14px; padding: 9px 10px 9px 14px; border-radius: 10px; background: #1d1c1a; color: #f3f1ed; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: all .22s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
:root[data-theme="dark"] .toast { background: #ecebe7; color: #1d1c1a; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 600; color: #9fd8bf; padding: 2px 6px; border-radius: 5px; }
:root[data-theme="dark"] .toast button { color: #2e6b57; }

/* Done */
.day { margin-bottom: 22px; }
.day > h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; padding: 0 10px 6px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); }
.day > h2 .n { color: var(--faint); font-weight: 500; }
.day > h2 button { margin-left: auto; font-weight: 500; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; padding: 2px 6px; border-radius: 6px; } .day > h2 button:hover { background: var(--hover); color: var(--ink); }

/* Settings */
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; margin-bottom: 16px; }
.card h2 { margin: 0 0 4px; font-size: 15px; }
.card p { margin: 0 0 12px; color: var(--muted); }
.code { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--chip); font: 12px/1.5 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.code span { flex: 1; }
.field { display: flex; align-items: center; gap: 12px; } .field input { flex: 1; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--canvas); }
.tokenrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.tokenrow .m { color: var(--muted); font-size: 12px; }
.tokenrow button { margin-left: auto; color: var(--muted); font-size: 12px; } .tokenrow button:hover { color: #b2443c; }

/* Keyboard sheet */
.keys { position: fixed; inset: 0; background: rgba(20,20,19,.35); display: none; place-items: center; z-index: 30; }
.keys.show { display: grid; }
.keys .sheet { width: 420px; background: var(--surface); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.keys h2 { margin: 0 0 10px; font: 600 18px var(--serif); }
.keys dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; margin: 0; }
.keys dt { color: var(--ink-2); } .keys dd { margin: 0; text-align: right; }

.empty { text-align: center; padding: 60px 0 20px; color: var(--muted); }
.empty svg.art { width: 120px; height: 90px; stroke: var(--faint); stroke-width: 1.3; fill: none; margin-bottom: 10px; }
.empty b { display: block; color: var(--ink-2); font: 600 17px var(--serif); margin-bottom: 4px; }

.note-banner { position: fixed; top: 10px; right: 12px; z-index: 40; font-size: 11.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
.note-banner button { color: var(--accent); font-weight: 600; }

/* Phone */
.tabs { display: none; }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .page { padding: 22px 16px 110px; }
  .tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--sidebar); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .tabs button { flex: 1; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px; }
  .tabs button[aria-current="page"] { color: var(--accent); }
  .row .acts { opacity: 1; }
  .detail { padding-left: 16px; }
  .note-banner { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="note-banner">UX mockup · invented data <button id="theme">Dark</button><button id="phone">Phone width</button></div>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark" data-i="check"></span>Todo</div>
    <button class="search" id="openSearch"><span data-i="search"></span>Search<kbd>⌘K</kbd></button>
    <button class="nav" data-view="tasks" aria-current="page"><span data-i="circle"></span>Tasks<span class="n" id="countTasks"></span></button>
    <button class="nav" data-view="done"><span data-i="done"></span>Done<span class="n" id="countDone"></span></button>
    <h3>Projects <button aria-label="New project" data-i="plus"></button></h3>
    <div id="projectNav"></div>
    <div class="spacer"></div>
    <button class="nav" data-view="trash"><span data-i="trash"></span>Trash</button>
    <button class="nav" data-view="settings"><span data-i="settings"></span>Settings</button>
    <div class="status"><i></i>Saved to vault</div>
  </aside>
  <main><div class="page" id="page"></div></main>
</div>
<nav class="tabs">
  <button data-view="tasks" aria-current="page"><span data-i="circle"></span>Tasks</button>
  <button data-view="done"><span data-i="done"></span>Done</button>
  <button id="tabSearch"><span data-i="search"></span>Search</button>
  <button data-view="settings"><span data-i="settings"></span>More</button>
</nav>
<div class="keys" id="find" style="place-items:start center;padding-top:14vh"><div class="sheet" style="width:560px;padding:6px">
  <label class="add" style="margin:0;border:0;box-shadow:none"><span data-i="search"></span><input id="findInput" placeholder="Find a task, project or note…" autocomplete="off" /><kbd>esc</kbd></label>
  <div id="findResults" class="pop" style="position:static;box-shadow:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:5px 0 0"></div>
</div></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>
<div class="keys" id="keys"><div class="sheet"><h2>Keyboard</h2><dl>
  <dt>Add a task</dt><dd><kbd>N</kbd></dd>
  <dt>Move between tasks</dt><dd><kbd>J</kbd> <kbd>K</kbd> or <kbd>↑</kbd> <kbd>↓</kbd></dd>
  <dt>Open / close details</dt><dd><kbd>↵</kbd> <kbd>Esc</kbd></dd>
  <dt>Complete</dt><dd><kbd>X</kbd> or <kbd>⌘</kbd><kbd>↵</kbd></dd>
  <dt>Copy task name</dt><dd><kbd>C</kbd></dd>
  <dt>Write notes</dt><dd><kbd>E</kbd></dd>
  <dt>Set project</dt><dd><kbd>P</kbd></dd>
  <dt>Set date</dt><dd><kbd>D</kbd></dd>
  <dt>Search</dt><dd><kbd>⌘</kbd><kbd>K</kbd></dd>
  <dt>This sheet</dt><dd><kbd>?</kbd></dd>
</dl></div></div>
<script>
const ICONS = {
  check: '<path d="M5 12l5 5L20 7"/>',
  circle: '<circle cx="12" cy="12" r="8.5"/>',
  done: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 002 1.8h7a2 2 0 002-1.8l1-12M9 7V4.5h6V7"/>',
  settings: '<path d="M10.3 4.3c.4-1.7 3-1.7 3.4 0a1.7 1.7 0 002.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 001 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 00-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 00-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 00-2.5-1c-1.6.9-3.3-.9-2.4-2.4a1.7 1.7 0 00-1.1-2.6c-1.7-.4-1.7-3 0-3.4a1.7 1.7 0 001.1-2.5c-.9-1.6.8-3.3 2.4-2.4a1.7 1.7 0 002.5-1.1z"/><circle cx="12" cy="12" r="3"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',
  dots: '<circle cx="5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="19" cy="12" r=".9"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  tag: '<path d="M7.5 7.5h.01M3 6v5.2a2 2 0 00.6 1.4l7.8 7.8a2 2 0 002.8 0l5.2-5.2a2 2 0 000-2.8L11.6 4.6A2 2 0 0010.2 4H5a2 2 0 00-2 2z"/>',
  bell: '<path d="M10 5a2 2 0 014 0 7 7 0 014 6v3l2 3H4l2-3v-3a7 7 0 014-6M9 17v1a3 3 0 006 0v-1"/>',
  repeat: '<path d="M4 12V9a3 3 0 013-3h13l-3-3M20 12v3a3 3 0 01-3 3H4l3 3"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
  note: '<path d="M6 4h9l4 4v12H6zM14 4v5h5M9 13h6M9 16.5h4"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6l.8.8L7 5M4.5 12l.8.8L7 11M4.5 18l.8.8L7 17"/>',

// Titles: URLs become short link chips, issue keys become key chips.
function richTitle(text) {

      return `<a class="chip" href="${url}" target="_blank" title="${url}">${icon("ext")}${u.host.split(".")[0]} › ${esc(last)}</a>`;

function md(src) {

    if ((m = /^- (.*)/.exec(line))) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(m[1])}</li>`); continue; }

    if ((m = /^#+ (.*)/.exec(line))) out.push(`<h4>${esc(m[1])}</h4>`);

}

let toastTimer, undoFn;
function toast(text, undo) {
  document.getElementById("toastText").textContent = text;
  undoFn = undo; document.getElementById("toastUndo").style.display = undo ? "" : "none";
  const el = document.getElementById("toast"); el.classList.add("show");

document.addEventListener("click", (e) => {
