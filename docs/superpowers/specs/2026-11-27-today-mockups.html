<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo · Today mockups</title>
<style>
:root{--paper:#f9f7f1;--rail:#eeece4;--ink:#292a28;--muted:#62645c;--rule:#d9d7cc;--accent:#51468f;--wash:#e7e3f3;--on:#fff;color-scheme:light}
:root.dark{--paper:#232421;--rail:#1c1d1b;--ink:#f2efe7;--muted:#b3b4aa;--rule:#44463f;--accent:#c0b7ff;--wash:#383540;--on:#252032;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--rail);font:15px/1.5 system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--wash)}button{background:none;border:0}button:hover,summary:hover{color:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px clamp(12px,4vw,64px);border-bottom:1px solid var(--rule);gap:8px}.toolbar span{font-size:13px;color:var(--muted)}.toolbar button{border:1px solid var(--rule);border-radius:5px;padding:4px 10px;font-size:13px}
.preview{max-width:1560px;margin:auto;padding:22px clamp(12px,3vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,348px);gap:24px;align-items:start}
figure{min-width:0;margin:0}figcaption{font-size:13px;color:var(--muted);margin-bottom:8px}
.frame{height:min(730px,82vh);min-height:510px;display:grid;grid-template-columns:clamp(156px,15vw,220px) minmax(0,1fr);background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.rail{background:var(--rail);border-right:1px solid var(--rule);padding:23px 12px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font:600 27px Georgia,serif;letter-spacing:-.04em;padding:0 10px;margin-bottom:30px}
.book{width:23px;height:25px;display:inline-block;border:2px solid var(--accent);border-radius:2px 5px 5px 2px;position:relative}.book:before{content:"";position:absolute;left:4px;top:0;bottom:0;border-left:1px solid var(--accent)}.book:after{content:"";position:absolute;right:3px;top:6px;width:8px;border-top:2px solid var(--accent)}
nav button{width:100%;text-align:left;padding:7px 12px;border-radius:4px;display:flex;align-items:center;gap:10px}nav .active{background:var(--wash);color:var(--accent);font-weight:600}.icon{width:18px;text-align:center}.rail small{display:block;margin:25px 12px 7px;color:var(--muted)}.project .icon{font-size:10px}
main{min-height:0;min-width:0;display:flex;flex-direction:column;padding:clamp(24px,3vw,48px) clamp(18px,3vw,48px) 0}.sheet{width:100%;max-width:760px;align-self:center}.title{font:normal clamp(40px,4vw,56px)/1.1 Georgia,serif;letter-spacing:-.04em;margin:0}.date{color:var(--muted);font-size:13px;margin:6px 0 24px}
form{display:flex;align-items:center;border:1px solid var(--rule);border-radius:5px;padding:5px 6px 5px 13px;gap:6px;min-height:48px}form:focus-within{border-color:var(--accent)}input{background:none;border:0;width:100%;min-width:0}input::placeholder{color:var(--muted)}.add{background:var(--accent);color:var(--on);border-radius:3px;padding:6px 13px}.add:hover{color:var(--on)}.count{color:var(--muted);font-size:13px;margin:23px 0 7px}
.list{overflow:auto;border-top:1px solid var(--rule);scrollbar-color:var(--rule) transparent}.row{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;border-bottom:1px solid var(--rule);padding:14px 0}.check{border:1.5px solid var(--muted);border-radius:50%;width:19px;height:19px;margin-top:3px;padding:0;font-size:12px}.row strong{font-weight:540;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;display:block;margin-top:2px}summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:5px}textarea{display:block;width:100%;margin-top:7px;background:var(--rail);border:1px solid var(--rule);border-radius:3px;padding:8px;font-size:13px;resize:vertical}.switch{display:none}.undo{align-self:center;color:var(--accent);margin:8px}
.phone .frame{display:flex;flex-direction:column}.phone .rail{display:none}.phone main{padding:24px 18px 0;flex:1}.phone .title{font-size:39px}.phone .switch{display:flex}.switch{background:var(--rail);border-bottom:1px solid var(--rule);align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}.switch .brand{margin:0;padding:0;font-size:23px}.switch select{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:5px;max-width:60%}
@media(max-width:1050px){.preview{grid-template-columns:1fr}.phone{max-width:390px;width:100%}}
@media(max-width:600px){.desktop{display:none}.preview{padding:12px}.phone{max-width:none}.phone .frame{height:calc(100dvh - 110px);min-height:320px}.check{position:relative}.check:after{content:"";position:absolute;inset:-12px}}
</style>
<header class="toolbar"><span>Today workspace mockups</span><button id="theme" aria-pressed="false">Dark theme</button></header>
<div class="preview"><figure class="desktop"><figcaption>Desktop</figcaption></figure><figure class="phone"><figcaption>Phone</figcaption></figure></div>
<template id="workspace"><div class="frame"><aside class="rail"><div class="brand"><i class="book"></i>Todo</div><nav></nav></aside><div class="switch"><div class="brand"><i class="book"></i>Todo</div><select aria-label="Switch view"></select></div><main><div class="sheet"><h1 class="title">Today</h1><p class="date">Friday, November 27</p><form><input aria-label="Task title" placeholder="Add a task…" required><button class="add">Add</button></form><p class="count"></p></div><div class="sheet list"></div><button class="undo" hidden>Undo completion</button></main></div></template>
<script>
const projects=['Personal','Studio','Home'];
const views=['Today','All tasks','Done',...projects];
const sample=[
 ['Send the revised floor plan','Studio','Include the west window measurements.'],
 ['Pick up the film scans','Personal','The shop closes at six.'],
 ['Book a service for the bicycle','Home',''],
 ['Draft the notes for Monday’s review','Studio','Start with the two layout options.'],
 ['Return the library books','Personal',''],
 ['Measure the kitchen shelf','Home','']
];
const theme=document.querySelector('#theme');
theme.onclick=()=>{const dark=document.documentElement.classList.toggle('dark');theme.setAttribute('aria-pressed',String(dark));theme.textContent=dark?'Light theme':'Dark theme'};
for(const figure of document.querySelectorAll('figure')){
 figure.append(document.querySelector('#workspace').content.cloneNode(true));
 const get=s=>figure.querySelector(s), nav=get('nav'), select=get('select'), form=get('form');
 const tasks=sample.map(([title,project,note])=>({title,project,note,done:false}));
 let view='Today',last=null;
 function choose(value){view=value;render()}
 views.forEach((name,i)=>{
  if(i===3){const label=document.createElement('small');label.textContent='Projects';nav.append(label)}
  const btn=document.createElement('button');btn.dataset.view=name;btn.className=i>=3?'project':'';
  const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=['☼','≡','✓'][i]||'○';
  btn.append(icon,name);btn.onclick=()=>choose(name);nav.append(btn);
  select.add(new Option(name,name));
 });
 select.onchange=()=>choose(select.value);
 function render(){
  get('h1').textContent=view;select.value=view;
  for(const btn of nav.querySelectorAll('button'))btn.classList.toggle('active',btn.dataset.view===view);
  form.hidden=view==='Done';form.style.display=form.hidden?'none':'flex';
  const items=tasks.filter(t=>view==='Done'?t.done:!t.done&&(!projects.includes(view)||t.project===view));
  get('.count').textContent=items.length+(items.length===1?' task':' tasks');
  const list=get('.list');list.replaceChildren();
  for(const t of items){
   const row=document.createElement('article');row.className='row';
   row.innerHTML='<button class="check"></button><div><strong></strong><span class="meta"></span><details><summary></summary><textarea rows="2" aria-label="Task notes"></textarea></details></div>';
   const find=s=>row.querySelector(s),check=find('button');
   check.textContent=t.done?'✓':'';check.setAttribute('aria-label',(t.done?'Restore ':'Complete ')+t.title);
   check.onclick=()=>{t.done=!t.done;last=t.done?t:null;render();(get('.list button')||get('select')).focus()};
   find('strong').textContent=t.title;find('.meta').textContent=t.project;find('summary').textContent=t.note?'Notes':'Add note';
   find('textarea').value=t.note;find('textarea').oninput=e=>{t.note=e.target.value;find('summary').textContent=t.note?'Notes':'Add note'};
   list.append(row);
  }
  get('.undo').hidden=!last;
 }
 form.onsubmit=e=>{e.preventDefault();const input=get('input');if(!input.value.trim())return;tasks.unshift({title:input.value.trim(),project:projects.includes(view)?view:'Personal',note:'',done:false});input.value='';render();input.focus()};
 get('.undo').onclick=()=>{if(last)last.done=false;last=null;render()};render();
}
</script>
</html>
